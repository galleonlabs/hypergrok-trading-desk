name: Improvement
description: Propose a bounded harness or Codex-interface improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user, research, control-plane, or operations outcome is missing?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Safety boundary
      description: Does this touch credentials, authorization, risk, reservations, OMS/outbox, signer, venue writes, or unattended behavior? State the invariant and failure mode.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and rollback
      description: Which tests prove the change and how is it disabled or rolled back safely?
    validations:
      required: true
