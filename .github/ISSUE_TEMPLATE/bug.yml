name: Bug report
description: Report incorrect harness behavior or a violated invariant
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include keys, signatures, authorization tokens, wallet exports, or private account payloads.
  - type: input
    id: file
    attributes:
      label: Component or file
      placeholder: src/trading_harness/store.py
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [local foundation, shadow, testnet, mainnet, not environment-specific]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened
      description: Include minimal redacted reproduction steps, state transitions, and whether any external write occurred.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior or invariant
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification evidence
      description: Test output, command/outbox state, or redacted logs that make the result reproducible.
