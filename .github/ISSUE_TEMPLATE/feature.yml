name: Improvement
description: Propose a bounded improvement to a role or skill
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a desk user or Bot cannot do well today.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Safety boundary
      description: Does this touch the write path, keys, approvals, transfers or unattended behaviour? Say how it stays inside the ticket protocol.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and rollback
      description: How will the improvement be proved, and how can it be backed out safely if the evidence disagrees?
    validations:
      required: true
