<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="400" height="840" role="img" aria-labelledby="t d"><title id="t">One trade, seven stages</title><desc id="d">1 idea, from you. 2 evidence, from the Market Analyst, Research Analyst and Strategist. 3 risk sign-off: the Risk Manager sizes the trade and issues the ticket. 4 your approval, by ticket id. 5 one send, by the Execution Trader, the only Bot with the key. 6 reconciliation: the Execution Trader confirms it from the exchange record. 7 review: the Trade Reviewer grades process and outcome separately.</desc><style>@font-face{font-family:'HG Inter';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'HG Inter';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'HG Inter';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'HG Mono';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@media (prefers-reduced-motion:reduce){*{animation:none!important}[class^=on]{opacity:0}}@keyframes on0{0.00%{opacity:1}5.83%{opacity:1}7.92%{opacity:0}100%{opacity:0}}.on0{opacity:0;animation:on0 12s linear infinite}@keyframes on1{0%{opacity:0}8.75%{opacity:0}10.83%{opacity:1}39.17%{opacity:1}41.25%{opacity:0}100%{opacity:0}}.on1{opacity:0;animation:on1 12s linear infinite}@keyframes on2{0%{opacity:0}42.92%{opacity:0}45.00%{opacity:1}52.50%{opacity:1}54.58%{opacity:0}100%{opacity:0}}.on2{opacity:0;animation:on2 12s linear infinite}@keyframes on3{0%{opacity:0}56.25%{opacity:0}58.33%{opacity:1}67.50%{opacity:1}69.58%{opacity:0}100%{opacity:0}}.on3{opacity:0;animation:on3 12s linear infinite}@keyframes on4{0%{opacity:0}70.42%{opacity:0}72.50%{opacity:1}84.17%{opacity:1}86.25%{opacity:0}100%{opacity:0}}.on4{opacity:0;animation:on4 12s linear infinite}@keyframes on5{0%{opacity:0}86.25%{opacity:0}88.33%{opacity:1}90.83%{opacity:1}92.92%{opacity:0}100%{opacity:0}}.on5{opacity:0;animation:on5 12s linear infinite}@keyframes on6{0%{opacity:0}92.92%{opacity:0}95.00%{opacity:1}98.33%{opacity:1}100.00%{opacity:0}}.on6{opacity:0;animation:on6 12s linear infinite}</style><defs><radialGradient id="bg" cx="0.85" cy="0" r="0.9"><stop offset="0" stop-color="#123832"/><stop offset="0.45" stop-color="#0d2723"/><stop offset="1" stop-color="#071815"/></radialGradient></defs><rect x=".5" y=".5" width="399" height="839" rx="18" fill="url(#bg)" stroke="#133631"/><text x="18.0" y="38.0" font-family="HG Inter" font-weight="700" font-size="14" fill="#96fbe3" letter-spacing="2.4">ONE TRADE, SEVEN STAGES</text><text x="18.0" y="60.0" font-family="HG Inter" font-weight="500" font-size="14" fill="#73c6b3">The Desk Lead keeps every trade on this path</text><rect x="18" y="80" width="364" height="69" rx="12" fill="#071815" stroke="#73c6b3" stroke-dasharray="5 4"/><g class="on0"><rect x="18" y="80" width="364" height="69" rx="12" fill="#96fbe3" fill-opacity=".07" stroke="#96fbe3" stroke-width="2"/></g><text x="32.0" y="107.0" font-family="HG Mono" font-weight="600" font-size="12" fill="#73c6b3">01</text><text x="66.0" y="107.0" font-family="HG Inter" font-weight="700" font-size="18" fill="#96fbe3">idea</text><text x="66.0" y="130.0" font-family="HG Inter" font-weight="500" font-size="14" fill="#9ecec1">You</text><path d="M48 149v16" stroke="#73c6b3" stroke-width="1.5"/><rect x="18" y="165" width="364" height="69" rx="12" fill="#071815" stroke="#1d4a43"/><g class="on1"><rect x="18" y="165" width="364" height="69" rx="12" fill="#96fbe3" fill-opacity=".07" stroke="#96fbe3" stroke-width="2"/></g><text x="32.0" y="192.0" font-family="HG Mono" font-weight="600" font-size="12" fill="#73c6b3">02</text><text x="66.0" y="192.0" font-family="HG Inter" font-weight="700" font-size="18" fill="#effdf8">evidence</text><text x="66.0" y="215.0" font-family="HG Inter" font-weight="500" font-size="14" fill="#9ecec1">Market Analyst, Research Analyst, Strategist</text><path d="M48 234v16" stroke="#73c6b3" stroke-width="1.5"/><rect x="18" y="250" width="364" height="69" rx="12" fill="#071815" stroke="#1d4a43"/><g class="on2"><rect x="18" y="250" width="364" height="69" rx="12" fill="#96fbe3" fill-opacity=".07" stroke="#96fbe3" stroke-width="2"/></g><text x="32.0" y="277.0" font-family="HG Mono" font-weight="600" font-size="12" fill="#73c6b3">03</text><text x="66.0" y="277.0" font-family="HG Inter" font-weight="700" font-size="18" fill="#effdf8">risk sign‑off</text><text x="66.0" y="300.0" font-family="HG Inter" font-weight="500" font-size="14" fill="#9ecec1">Risk Manager sizes it and issues the ticket</text><path d="M48 319v16" stroke="#73c6b3" stroke-width="1.5"/><rect x="18" y="335" width="364" height="69" rx="12" fill="#071815" stroke="#73c6b3" stroke-dasharray="5 4"/><g class="on3"><rect x="18" y="335" width="364" height="69" rx="12" fill="#96fbe3" fill-opacity=".07" stroke="#96fbe3" stroke-width="2"/></g><text x="32.0" y="362.0" font-family="HG Mono" font-weight="600" font-size="12" fill="#73c6b3">04</text><text x="66.0" y="362.0" font-family="HG Inter" font-weight="700" font-size="18" fill="#96fbe3">your approval</text><text x="66.0" y="385.0" font-family="HG Inter" font-weight="500" font-size="14" fill="#9ecec1">You, by ticket id</text><path d="M48 404v16" stroke="#73c6b3" stroke-width="1.5"/><rect x="18" y="420" width="364" height="69" rx="12" fill="#96fbe3" stroke="#96fbe3"/><g class="on4"><rect x="18" y="420" width="364" height="69" rx="12" fill="none" fill-opacity=".07" stroke="#effdf8" stroke-width="2"/></g><text x="32.0" y="447.0" font-family="HG Mono" font-weight="600" font-size="12" fill="#0b3a32">05</text><text x="66.0" y="447.0" font-family="HG Inter" font-weight="700" font-size="18" fill="#062520">one send</text><text x="66.0" y="470.0" font-family="HG Inter" font-weight="500" font-size="14" fill="#0b3a32">Execution Trader, the only Bot with the key</text><path d="M48 489v16" stroke="#73c6b3" stroke-width="1.5"/><rect x="18" y="505" width="364" height="88" rx="12" fill="#071815" stroke="#1d4a43"/><g class="on5"><rect x="18" y="505" width="364" height="88" rx="12" fill="#96fbe3" fill-opacity=".07" stroke="#96fbe3" stroke-width="2"/></g><text x="32.0" y="532.0" font-family="HG Mono" font-weight="600" font-size="12" fill="#73c6b3">06</text><text x="66.0" y="532.0" font-family="HG Inter" font-weight="700" font-size="18" fill="#effdf8">reconciliation</text><text x="66.0" y="555.0" font-family="HG Inter" font-weight="500" font-size="14" fill="#9ecec1">Execution Trader confirms it from the</text><text x="66.0" y="574.0" font-family="HG Inter" font-weight="500" font-size="14" fill="#9ecec1">exchange record</text><path d="M48 593v16" stroke="#73c6b3" stroke-width="1.5"/><rect x="18" y="609" width="364" height="88" rx="12" fill="#071815" stroke="#1d4a43"/><g class="on6"><rect x="18" y="609" width="364" height="88" rx="12" fill="#96fbe3" fill-opacity=".07" stroke="#96fbe3" stroke-width="2"/></g><text x="32.0" y="636.0" font-family="HG Mono" font-weight="600" font-size="12" fill="#73c6b3">07</text><text x="66.0" y="636.0" font-family="HG Inter" font-weight="700" font-size="18" fill="#effdf8">review</text><text x="66.0" y="659.0" font-family="HG Inter" font-weight="500" font-size="14" fill="#9ecec1">Trade Reviewer grades process and</text><text x="66.0" y="678.0" font-family="HG Inter" font-weight="500" font-size="14" fill="#9ecec1">outcome separately</text><path d="M18 719H382" stroke="#133631"/><rect x="18" y="737" width="11" height="11" rx="3" fill="none" stroke="#73c6b3" stroke-dasharray="2.5 2"/><text x="36.0" y="747.0" font-family="HG Inter" font-weight="600" font-size="13.5" fill="#d6f5eb">You</text><text x="65.5" y="747.0" font-family="HG Inter" font-weight="500" font-size="13.5" fill="#9ecec1">decide</text><rect x="18" y="761" width="11" height="11" rx="3" fill="#96fbe3"/><text x="36.0" y="771.0" font-family="HG Inter" font-weight="600" font-size="13.5" fill="#d6f5eb">One writer</text><text x="107.8" y="771.0" font-family="HG Inter" font-weight="500" font-size="13.5" fill="#9ecec1">touches the exchange</text><text x="18.0" y="799.0" font-family="HG Inter" font-weight="500" font-size="13.5" fill="#9ecec1">Six Bots share the Trading Floor; the Trade Reviewer</text><text x="18.0" y="818.0" font-family="HG Inter" font-weight="500" font-size="13.5" fill="#9ecec1">works by DM</text></svg>
