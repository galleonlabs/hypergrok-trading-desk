<!doctype html>
<!-- Source for assets/hero.png. Render: see assets/src/README.md -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #071815; --panel: #0d2723; --line: #133631; --line-hi: #1d4a43;
    --mint: #96fbe3; --mint-dim: #73c6b3; --text: #d6f5eb; --muted: #9ecec1;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; width: 800px; height: 300px; }
  .card {
    position: relative; overflow: hidden;
    width: 800px; height: 300px; border-radius: 16px;
    background: radial-gradient(520px 300px at 18% 30%, #123832 0%, var(--panel) 45%, var(--bg) 100%);
    border: 1px solid var(--line);
    font-family: Inter, sans-serif; color: var(--text);
    display: grid; grid-template-columns: 216px 1fr; align-items: center;
    padding: 0 40px 0 40px; gap: 32px;
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 24px 24px; opacity: .35;
    mask-image: linear-gradient(90deg, transparent 30%, #000 100%);
  }
  .mascot {
    position: relative; width: 216px; height: 216px; border-radius: 40px; overflow: hidden;
    border: 1px solid var(--line-hi);
  }
  .mascot img { width: 100%; height: 100%; display: block; }
  .copy { position: relative; }
  .eyebrow {
    font-weight: 700; font-size: 11px; letter-spacing: .2em; color: var(--mint-dim);
    text-transform: uppercase;
  }
  h1 { font-weight: 800; font-size: 56px; letter-spacing: -.03em; line-height: 1; margin-top: 10px; color: #effdf8; }
  .tag { font-size: 19px; font-weight: 500; color: var(--muted); margin-top: 10px; }
  .tag b { color: var(--mint); font-weight: 600; }
  .roles { display: flex; align-items: center; gap: 6px; margin-top: 26px; }
  .chip {
    font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 12px;
    width: 38px; height: 30px; border-radius: 8px; display: grid; place-items: center;
    background: var(--bg); border: 1px solid var(--line-hi); color: var(--muted);
  }
  .chip.writer { background: var(--mint); border-color: var(--mint); color: #062520; }
  .arrow { color: var(--mint-dim); font-size: 13px; margin: 0 4px 0 6px; }
  .you {
    font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 12px;
    height: 30px; padding: 0 10px; border-radius: 8px; display: grid; place-items: center;
    border: 1px dashed var(--mint-dim); color: var(--mint);
  }
  .legend { font-size: 12px; color: var(--mint-dim); margin-top: 10px; }
  .legend span { color: var(--mint); }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="mascot"><img src="../mascot.jpg" alt=""></div>
    <div class="copy">
      <div class="eyebrow">Hyperliquid trading desk for Grok Bot</div>
      <h1>HyperGrok</h1>
      <p class="tag">Seven agents, <b>one writer</b>, your approval.</p>
      <div class="roles">
        <div class="chip">DL</div><div class="chip">MA</div><div class="chip">RA</div>
        <div class="chip">ST</div><div class="chip">RM</div><div class="chip">TR</div>
        <div class="you">you approve</div>
        <span class="arrow">&rarr;</span>
        <div class="chip writer">ET</div>
      </div>
      <p class="legend">Six roles read. <span>The Execution Trader</span> sends the ticket you approved, once.</p>
    </div>
  </div>
</body>
</html>
