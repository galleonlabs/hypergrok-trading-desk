[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypergrok"
version = "0.1.0"
description = "A Hyperliquid trading desk for Grok Bot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Galleon Labs"}]
dependencies = ["hyperliquid-python-sdk>=0.20.0,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[project.scripts]
hypergrok = "hypergrok.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hypergrok"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hypergrok"]

[[tool.mypy.overrides]]
module = ["hyperliquid.*"]
ignore_missing_imports = true
