# Trusted repository jobs use the dappnode runner and its installed tools.
# Native git avoids shared-IP action-download throttling; fork PRs never run here.
name: Public Grok Bot template
on:
  schedule:
    - cron: 17 6 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  verify:
    runs-on:
      - self-hosted
      - linux
      - x64
      - dappnode
    steps:
      - name: Checkout with runner git
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if [[ ! -d .git ]]; then
            git init
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" fetch --force --prune --tags origin "+refs/heads/*:refs/remotes/origin/*" "$GITHUB_SHA"
          unset header
          git checkout --force --detach "$GITHUB_SHA"
          git clean -ffdx -e 'node_modules/' -e '**/node_modules/'
          git log -1 --oneline
      - name: Compare the public preview with the release contract
        run: python3 scripts/check_public_template.py --live
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
